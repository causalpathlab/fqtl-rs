[workspace]

members = [
    "crates/candle-util",
    "crates/fqtl-rs",
    "crates/genomic-data",
    "crates/leiden",
    "crates/matrix-util",
    "crates/mcmc-util",
]

resolver = "3"

[workspace.package]
license = "MIT"
authors = ["Yongjin Park <ypp@stat.ubc.ca> <yongjin.park@ubc.ca>"]
description = "Fine-mapping and QTL tooling in Rust"
repository = "https://github.com/causalpathlab/fqtl-rs"
homepage = "https://github.com/causalpathlab/fqtl-rs"
edition = "2021"
rust-version = "1.85"

[workspace.dependencies]

# Core / CLI
anyhow = "1.0"
clap = { version = "4.5.20", features = ["derive"] }
ctrlc = { version = "3", features = ["termination"] }
env_logger = "0.11"
log = "0.4"

# Parallelism
num_cpus = "1.16.0"
rayon = "1.10.0"

# Randomness
rand = "0.10.1"
rand_distr = "0.6"
tempfile = "3.2"

# Numeric / linear algebra
approx = "0.5.1"
nalgebra = "0.34"
nalgebra-sparse = "0.11"
ndarray = { version = "0.17", features = ["rayon", "serde", "approx", "blas"] }
ndarray-rand = "0.16"
num-traits = "0.2.19"
special = "0.13"
statrs = "0.18"

# Data structures / hashing
dashmap = { version = "6.1.0", features = ["rayon"] }
rustc-hash = "2.1"

# Serialization / IO
flate2 = "1.0.34"
arrow = "59"
parquet = "59"
regex = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
zip = "8"

# Bioinformatics
rust-htslib = "1.0"

# Nearest neighbours / clustering
instant-distance = "0.6"
multiversion = "0.8"
clustering = { version = "0.2", features = ["parallel"] }

# Graphs
petgraph = "0.8"

# Progress / display
colored = "3"
indicatif = { version = "^0.18", features = ["rayon"] }

# Internal crates
candle-util = { path = "crates/candle-util" }
genomic-data = { path = "crates/genomic-data" }
leiden = { path = "crates/leiden" }
matrix-util = { path = "crates/matrix-util" }
mcmc-util = { path = "crates/mcmc-util" }

# candle-core with CPU elementwise maps threaded over rayon (causalpathlab fork).
[patch.crates-io]
candle-core = { git = "https://github.com/causalpathlab/candle", rev = "7d19a1d3a1b96b8409baad88700f96e80ec9da25" }
candle-nn = { git = "https://github.com/causalpathlab/candle", rev = "7d19a1d3a1b96b8409baad88700f96e80ec9da25" }
